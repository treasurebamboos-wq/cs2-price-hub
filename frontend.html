<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Price Hub</title>
<style>
:root {
    --bg: #0f1923;
    --card: #1a2736;
    --border: #2a3a4a;
    --text: #e0e6ed;
    --text2: #8899aa;
    --accent: #4fc3f7;
    --green: #4caf50;
    --red: #ef5350;
    --orange: #ff9800;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* 顶栏 */
.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 20px; font-weight: 600; }
.header h1 span { color: var(--accent); }
.header-right { display: flex; gap: 12px; align-items: center; }
.stats-badge { background: var(--bg); padding: 4px 12px; border-radius: 20px; font-size: 12px; color: var(--text2); }
.stats-badge b { color: var(--accent); }
.btn { background: var(--accent); color: #000; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { opacity: 0.85; }
.btn.secondary { background: var(--border); color: var(--text); }

/* 搜索 */
.search-bar { padding: 16px 24px; }
.search-bar input { width: 100%; max-width: 500px; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 14px; outline: none; }
.search-bar input:focus { border-color: var(--accent); }
.search-bar input::placeholder { color: var(--text2); }

/* 表格 */
.table-wrap { padding: 0 24px 24px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { background: var(--card); color: var(--text2); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); position: sticky; top: 60px; z-index: 10; }
td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
tr { cursor: pointer; transition: background 0.1s; }
tr:hover td { background: rgba(79,195,247,0.05); }
.price { font-weight: 600; color: var(--orange); }
.volume { color: var(--green); }
.text-muted { color: var(--text2); }
.text-sm { font-size: 12px; }
.name-cn { font-weight: 500; }
.name-en { color: var(--text2); font-size: 11px; margin-top: 2px; }
.tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px; }
.tag-vol { background: rgba(76,175,80,0.15); color: var(--green); }
.tag-tx { background: rgba(79,195,247,0.15); color: var(--accent); }

/* 详情弹窗 */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:200; justify-content:center; align-items:flex-start; padding-top:60px; }
.modal-overlay.active { display:flex; }
.modal { background:var(--card); border:1px solid var(--border); border-radius:12px; width:90%; max-width:800px; max-height:80vh; overflow-y:auto; padding:24px; }
.modal h2 { font-size:18px; margin-bottom:4px; }
.modal h3 { font-size:14px; color:var(--text2); margin-bottom:16px; }
.modal-close { float:right; cursor:pointer; font-size:20px; color:var(--text2); background:none; border:none; }
.modal-close:hover { color:var(--text); }

.info-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
.info-card { background:var(--bg); border-radius:8px; padding:12px; }
.info-card .label { font-size:11px; color:var(--text2); text-transform:uppercase; margin-bottom:4px; }
.info-card .value { font-size:18px; font-weight:600; }
.info-card .value.ask { color:var(--orange); }
.info-card .value.bid { color:var(--accent); }
.info-card .value.vol { color:var(--green); }

/* 图表 */
.chart-section { margin-top:16px; }
.chart-section h4 { font-size:13px; color:var(--text2); margin-bottom:8px; }
canvas { width:100%; height:200px; background:var(--bg); border-radius:8px; }

/* 成交记录列表 */
.tx-list { max-height:250px; overflow-y:auto; margin-top:16px; }
.tx-list h4 { font-size:13px; color:var(--text2); margin-bottom:8px; }
.tx-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:12px; }
.tx-price { color:var(--orange); font-weight:500; }
.tx-time { color:var(--text2); }

/* 加载 */
.loading { text-align:center; padding:40px; color:var(--text2); }

/* 分页 */
.pagination { display:flex; justify-content:center; gap:8px; padding:16px; }
.pagination button { background:var(--card); color:var(--text); border:1px solid var(--border); padding:6px 14px; border-radius:6px; cursor:pointer; }
.pagination button.active { background:var(--accent); color:#000; border-color:var(--accent); }
</style>
</head>
<body>

<div class="header">
    <h1>🎮 CS2 <span>Price Hub</span></h1>
    <div class="header-right">
        <span class="stats-badge" id="statsInfo">加载中...</span>
        <button class="btn" onclick="triggerScrape()">🔄 手动爬取</button>
        <button class="btn secondary" onclick="triggerDetailScrape()">📜 爬取成交</button>
    </div>
</div>

<div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜索饰品名称（中文/英文）..." oninput="debounceSearch()">
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>饰品名称</th>
                <th>Buff最低价</th>
                <th>求购价</th>
                <th>Steam价</th>
                <th>在售</th>
                <th>24h成交</th>
                <th>成交均价</th>
                <th>更新时间</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="8" class="loading">加载中...</td></tr>
        </tbody>
    </table>
</div>

<div class="pagination" id="pagination"></div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>
const API = '';
const PAGE_SIZE = 50;
let currentPage = 1;
let allData = [];
let searchTimer = null;

// 加载数据
async function loadData() {
    const res = await fetch(`${API}/api/prices/latest?limit=500`);
    const json = await res.json();
    if (json.success) {
        allData = json.data;
        renderTable();
        loadStats();
    }
}

// 搜索
function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 300);
}

async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) { loadData(); return; }

    const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
    const json = await res.json();
    if (json.success) {
        allData = json.data;
        currentPage = 1;
        renderTable();
    }
}

// 渲染表格
function renderTable() {
    const tbody = document.getElementById('tableBody');
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageData = allData.slice(start, start + PAGE_SIZE);

    if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="loading">暂无数据</td></tr>';
        return;
    }

    tbody.innerHTML = pageData.map(item => {
        const b = item.prices?.buff || {};
        const vol24h = item.volume_24h || 0;
        const txCount = item.transaction_count || 0;
        const updated = b.updated_at ? new Date(b.updated_at).toLocaleTimeString('zh-CN') : '-';
        const askPrice = b.ask != null ? `¥${num(b.ask)}` : '-';
        const bidPrice = b.bid != null ? `¥${num(b.bid)}` : '-';
        const steamPrice = b.steam_price != null ? `¥${num(b.steam_price)}` : '-';
        const quickPrice = b.quick_price != null ? `¥${num(b.quick_price)}` : '-';

        return `<tr onclick="showDetail('${esc(item.market_hash_name)}')">
            <td>
                <div class="name-cn">${esc(item.name || '')}</div>
                <div class="name-en">${esc(item.market_hash_name || '')}</div>
            </td>
            <td class="price">${askPrice}</td>
            <td class="price" style="color:var(--accent)">${bidPrice}</td>
            <td class="text-muted">${steamPrice}</td>
            <td class="volume">${b.ask_volume || 0}</td>
            <td>${vol24h > 0 ? `<span class="tag tag-vol">${vol24h}笔</span>` : '<span class="text-muted">-</span>'}</td>
            <td>${quickPrice}</td>
            <td class="text-muted text-sm">${updated}</td>
        </tr>`;
    }).join('');

    renderPagination();
}

// 分页
function renderPagination() {
    const total = Math.ceil(allData.length / PAGE_SIZE);
    if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

    let html = '';
    for (let i = 1; i <= total; i++) {
        html += `<button class="${i===currentPage?'active':''}" onclick="gotoPage(${i})">${i}</button>`;
    }
    document.getElementById('pagination').innerHTML = html;
}

function gotoPage(p) { currentPage = p; renderTable(); window.scrollTo(0, 0); }

// 详情弹窗
async function showDetail(name) {
    const modal = document.getElementById('modal');
    const content = document.getElementById('modalContent');
    modal.classList.add('active');
    content.innerHTML = '<div class="loading">加载中...</div>';

    const res = await fetch(`${API}/api/item/${encodeURIComponent(name)}`);
    const json = await res.json();
    if (!json.success) { content.innerHTML = '加载失败'; return; }

    const item = json.data;
    const b = item.prices?.buff || {};
    const vol24h = item.volume_24h || 0;
    const txs = item.transactions || [];

    let html = `
        <h2>${esc(item.name || '')}</h2>
        <h3>${esc(item.market_hash_name || '')}</h3>
        <div class="info-grid">
            <div class="info-card"><div class="label">Buff最低价</div><div class="value ask">¥${num(b.ask)}</div></div>
            <div class="info-card"><div class="label">最高求购</div><div class="value bid">¥${num(b.bid)}</div></div>
            <div class="info-card"><div class="label">Steam价</div><div class="value">¥${num(b.steam_price)}</div></div>
            <div class="info-card"><div class="label">在售数量</div><div class="value vol">${b.ask_volume || 0}</div></div>
            <div class="info-card"><div class="label">求购数量</div><div class="value">${b.bid_volume || 0}</div></div>
            <div class="info-card"><div class="label">24h成交量</div><div class="value vol">${vol24h}笔</div></div>
            <div class="info-card"><div class="label">成交均价</div><div class="value ask">¥${num(b.quick_price)}</div></div>
            <div class="info-card"><div class="label">Buff/Steam</div><div class="value">${b.ask&&b.steam_price ? ((b.ask/b.steam_price)*100).toFixed(1)+'%' : '-'}</div></div>
        </div>
    `;

    // 价格走势图
    const history = item.priceHistory || [];
    if (history.length > 1) {
        html += `<div class="chart-section"><h4>📈 价格走势（采集记录）</h4><canvas id="priceChart"></canvas></div>`;
    }

    // Buff历史价格
    const buffHistory = item.buffPriceHistory || [];
    if (buffHistory.length > 1) {
        html += `<div class="chart-section"><h4>📊 Buff历史价格</h4><canvas id="buffChart"></canvas></div>`;
    }

    // 成交记录
    if (txs.length > 0) {
        html += `<div class="tx-list"><h4>📜 最近成交记录 (${txs.length}条)</h4>`;
        txs.slice(-20).reverse().forEach(tx => {
            const t = typeof tx.time === 'number' ?
                (tx.time > 1e12 ? new Date(tx.time) : new Date(tx.time * 1000)).toLocaleString('zh-CN') :
                tx.time || '-';
            html += `<div class="tx-item"><span class="tx-price">¥${num(tx.price)}</span><span class="tx-time">${t}</span></div>`;
        });
        html += '</div>';
    }

    content.innerHTML = html;

    // 绘制价格走势
    if (history.length > 1) drawChart('priceChart', history.map(h => ({ t: h.t, p: h.p })));
    if (buffHistory.length > 1) drawChart('buffChart', buffHistory.map(h => ({ t: h[0]*1000, p: h[1] })));
}

function closeModal() { document.getElementById('modal').classList.remove('active'); }

// 简易Canvas图表
function drawChart(canvasId, data) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 400;
    const pad = { top: 20, right: 60, bottom: 30, left: 10 };

    const prices = data.map(d => d.p);
    const minP = Math.min(...prices) * 0.98;
    const maxP = Math.max(...prices) * 1.02;

    ctx.clearRect(0, 0, W, H);

    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
        const y = pad.top + (H - pad.top - pad.bottom) * i / 4;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
        const price = maxP - (maxP - minP) * i / 4;
        ctx.fillStyle = '#667788';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('¥' + num(price), W - 5, y + 6);
    }

    // 价格线
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 2;
    ctx.beginPath();
    data.forEach((d, i) => {
        const x = pad.left + (W - pad.left - pad.right) * i / (data.length - 1);
        const y = pad.top + (H - pad.top - pad.bottom) * (1 - (d.p - minP) / (maxP - minP));
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 渐变填充
    const grad = ctx.createLinearGradient(0, pad.top, 0, H - pad.bottom);
    grad.addColorStop(0, 'rgba(79,195,247,0.15)');
    grad.addColorStop(1, 'rgba(79,195,247,0)');
    ctx.lineTo(W - pad.right, H - pad.bottom);
    ctx.lineTo(pad.left, H - pad.bottom);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
}

// 统计
async function loadStats() {
    const res = await fetch(`${API}/api/stats`);
    const json = await res.json();
    if (json.success) {
        const s = json.data;
        const time = s.lastUpdate ? new Date(s.lastUpdate).toLocaleTimeString('zh-CN') : '-';
        document.getElementById('statsInfo').innerHTML =
            `饰品 <b>${s.totalItems}</b> | 成交记录 <b>${s.totalTransactions}</b> | 更新 <b>${time}</b>`;
    }
}

// 触发爬取
async function triggerScrape() {
    await fetch(`${API}/api/scrape`);
    alert('爬取已启动，请稍后刷新');
}
async function triggerDetailScrape() {
    await fetch(`${API}/api/scrape/details`);
    alert('成交记录爬取已启动，请稍后刷新');
}

// 工具
function num(n) { return n != null ? Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : '-'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// 自动刷新
loadData();
setInterval(loadData, 60000);  // 每分钟刷新
</script>
</body>
</html>
