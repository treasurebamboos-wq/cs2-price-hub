<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Price Hub</title>
<style>
:root{--bg:#0f1923;--card:#1a2736;--border:#2a3a4a;--text:#e0e6ed;--text2:#8899aa;--accent:#4fc3f7;--green:#4caf50;--red:#ef5350;--orange:#ff9800}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:600}.header h1 span{color:var(--accent)}
.header-right{display:flex;gap:12px;align-items:center}
.stats-badge{background:var(--bg);padding:4px 12px;border-radius:20px;font-size:12px;color:var(--text2)}
.stats-badge b{color:var(--accent)}
.search-bar{padding:16px 24px}
.search-bar input{width:100%;max-width:500px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-size:14px;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--text2)}
.table-wrap{padding:0 24px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--card);color:var(--text2);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:10}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
tr{cursor:pointer;transition:background .1s}tr:hover td{background:rgba(79,195,247,.05)}
.price{font-weight:600;color:var(--orange)}.volume{color:var(--green)}.text-muted{color:var(--text2)}.text-sm{font-size:12px}
.name-cn{font-weight:500}.name-en{color:var(--text2);font-size:11px;margin-top:2px}
.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;margin-left:4px}
.tag-vol{background:rgba(76,175,80,.15);color:var(--green)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:flex-start;padding-top:60px}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:90%;max-width:800px;max-height:80vh;overflow-y:auto;padding:24px}
.modal h2{font-size:18px;margin-bottom:4px}.modal h3{font-size:14px;color:var(--text2);margin-bottom:16px}
.modal-close{float:right;cursor:pointer;font-size:20px;color:var(--text2);background:none;border:none}.modal-close:hover{color:var(--text)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.info-card{background:var(--bg);border-radius:8px;padding:12px}
.info-card .label{font-size:11px;color:var(--text2);text-transform:uppercase;margin-bottom:4px}
.info-card .value{font-size:18px;font-weight:600}
.info-card .value.ask{color:var(--orange)}.info-card .value.bid{color:var(--accent)}.info-card .value.vol{color:var(--green)}
.chart-section{margin-top:16px}.chart-section h4{font-size:13px;color:var(--text2);margin-bottom:8px}
canvas{width:100%;height:200px;background:var(--bg);border-radius:8px}
.tx-list{max-height:250px;overflow-y:auto;margin-top:16px}.tx-list h4{font-size:13px;color:var(--text2);margin-bottom:8px}
.tx-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.tx-price{color:var(--orange);font-weight:500}.tx-time{color:var(--text2)}
.loading{text-align:center;padding:40px;color:var(--text2)}
.pagination{display:flex;justify-content:center;gap:8px;padding:16px}
.pagination button{background:var(--card);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer}
.pagination button.active{background:var(--accent);color:#000;border-color:var(--accent)}
.ratio-up{color:var(--red)}.ratio-down{color:var(--green)}
</style>
</head>
<body>

<div class="header">
    <h1>🎮 CS2 <span>Price Hub</span></h1>
    <div class="header-right">
        <span class="stats-badge" id="statsInfo">加载中...</span>
    </div>
</div>

<div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 搜索饰品名称（中文/英文）..." oninput="debounceSearch()">
</div>

<div class="table-wrap">
    <table>
        <thead><tr>
            <th>饰品名称</th>
            <th>Buff最低价</th>
            <th>求购价</th>
            <th>Steam价</th>
            <th>Buff/Steam</th>
            <th>在售</th>
            <th>24h成交</th>
            <th>成交均价</th>
            <th>更新时间</th>
        </tr></thead>
        <tbody id="tableBody"><tr><td colspan="9" class="loading">加载中...</td></tr></tbody>
    </table>
</div>
<div class="pagination" id="pagination"></div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal"><button class="modal-close" onclick="closeModal()">✕</button><div id="modalContent"></div></div>
</div>

<script>
// ===== 数据源：从 GitHub 读取 =====
const DATA_URL = 'https://raw.githubusercontent.com/treasurebamboos-wq/cs2-price-hub/master/data/prices.json';
const PAGE_SIZE = 50;
let currentPage = 1;
let rawItems = {};   // 原始数据
let allData = [];    // 处理后的数组
let searchTimer = null;

// 标准化字段（兼容新旧格式）
function normalize(item, key) {
    const b = item.prices?.buff || {};
    return {
        market_hash_name: key,
        name: item.name,
        goods_id: item.goods_id,
        ask: b.ask ?? b.price ?? null,
        ask_volume: b.ask_volume ?? b.volume ?? b.sell_num ?? 0,
        bid: b.bid ?? b.buy_price ?? null,
        bid_volume: b.bid_volume ?? b.buy_num ?? 0,
        steam_price: b.steam_price ?? null,
        quick_price: b.quick_price ?? null,
        updated_at: b.updated_at ?? null,
        priceHistory: item.priceHistory || [],
        buffPriceHistory: item.buffPriceHistory || [],
        transactions: item.transactions || [],
        volume_24h: countVol24h(item.transactions),
        transaction_count: (item.transactions || []).length,
    };
}

function countVol24h(txs) {
    if (!txs?.length) return 0;
    const cutoff = Date.now() / 1000 - 86400;
    return txs.filter(t => {
        const ts = typeof t.time === 'number' ? (t.time > 1e12 ? t.time/1000 : t.time) : 0;
        return ts > cutoff;
    }).length;
}

// ===== 加载数据 =====
async function loadData() {
    try {
        const res = await fetch(DATA_URL + '?t=' + Date.now());
        const json = await res.json();
        rawItems = json.items || {};
        processData();
        renderStats(json.meta || json.stats || {});
    } catch (e) {
        document.getElementById('tableBody').innerHTML =
            `<tr><td colspan="9" class="loading">加载失败：${e.message}</td></tr>`;
    }
}

function processData(filter) {
    let entries = Object.entries(rawItems);
    if (filter) {
        const q = filter.toLowerCase();
        entries = entries.filter(([k, v]) =>
            k.toLowerCase().includes(q) || (v.name || '').toLowerCase().includes(q)
        );
    }
    allData = entries.map(([k, v]) => normalize(v, k));
    allData.sort((a, b) => (b.ask_volume || 0) - (a.ask_volume || 0));
    renderTable();
}

// ===== 搜索 =====
function debounceSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 300); }
function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    currentPage = 1;
    processData(q || null);
}

// ===== 渲染表格 =====
function renderTable() {
    const tbody = document.getElementById('tableBody');
    const start = (currentPage - 1) * PAGE_SIZE;
    const page = allData.slice(start, start + PAGE_SIZE);

    if (!page.length) { tbody.innerHTML = '<tr><td colspan="9" class="loading">暂无数据</td></tr>'; return; }

    tbody.innerHTML = page.map(d => {
        const ratio = d.ask && d.steam_price ? (d.ask / d.steam_price * 100).toFixed(1) : null;
        const ratioClass = ratio ? (ratio < 70 ? 'ratio-down' : ratio > 90 ? 'ratio-up' : '') : '';
        const updated = d.updated_at ? new Date(d.updated_at).toLocaleTimeString('zh-CN') : '-';
        return `<tr onclick="showDetail('${esc(d.market_hash_name)}')">
            <td><div class="name-cn">${esc(d.name||'')}</div><div class="name-en">${esc(d.market_hash_name)}</div></td>
            <td class="price">${fmtPrice(d.ask)}</td>
            <td class="price" style="color:var(--accent)">${fmtPrice(d.bid)}</td>
            <td class="text-muted">${fmtPrice(d.steam_price)}</td>
            <td class="${ratioClass}">${ratio ? ratio+'%' : '-'}</td>
            <td class="volume">${d.ask_volume}</td>
            <td>${d.volume_24h>0?`<span class="tag tag-vol">${d.volume_24h}笔</span>`:'<span class="text-muted">-</span>'}</td>
            <td>${fmtPrice(d.quick_price)}</td>
            <td class="text-muted text-sm">${updated}</td>
        </tr>`;
    }).join('');

    renderPagination();
}

function renderPagination() {
    const total = Math.ceil(allData.length / PAGE_SIZE);
    if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
    let html = '';
    for (let i = 1; i <= Math.min(total, 10); i++)
        html += `<button class="${i===currentPage?'active':''}" onclick="gotoPage(${i})">${i}</button>`;
    if (total > 10) html += `<button disabled>... ${total}页</button>`;
    document.getElementById('pagination').innerHTML = html;
}
function gotoPage(p) { currentPage = p; renderTable(); window.scrollTo(0,0); }

// ===== 统计 =====
function renderStats(meta) {
    const items = Object.values(rawItems);
    const totalTx = items.reduce((s,i) => s + (i.transactions?.length||0), 0);
    const lastUpdate = meta.lastUpdate ? new Date(meta.lastUpdate).toLocaleString('zh-CN') : '-';
    document.getElementById('statsInfo').innerHTML =
        `饰品 <b>${items.length}</b> | 成交 <b>${totalTx}</b> | 更新 <b>${lastUpdate}</b>`;
}

// ===== 详情弹窗 =====
function showDetail(name) {
    const item = rawItems[name];
    if (!item) return;
    const d = normalize(item, name);
    const modal = document.getElementById('modal');
    modal.classList.add('active');

    const ratio = d.ask && d.steam_price ? (d.ask / d.steam_price * 100).toFixed(1) + '%' : '-';
    let html = `
        <h2>${esc(d.name||'')}</h2><h3>${esc(d.market_hash_name)}</h3>
        <div class="info-grid">
            <div class="info-card"><div class="label">Buff最低价</div><div class="value ask">${fmtPrice(d.ask)}</div></div>
            <div class="info-card"><div class="label">最高求购</div><div class="value bid">${fmtPrice(d.bid)}</div></div>
            <div class="info-card"><div class="label">Steam价</div><div class="value">${fmtPrice(d.steam_price)}</div></div>
            <div class="info-card"><div class="label">在售数量</div><div class="value vol">${d.ask_volume}</div></div>
            <div class="info-card"><div class="label">求购数量</div><div class="value">${d.bid_volume}</div></div>
            <div class="info-card"><div class="label">24h成交量</div><div class="value vol">${d.volume_24h}笔</div></div>
            <div class="info-card"><div class="label">成交均价</div><div class="value ask">${fmtPrice(d.quick_price)}</div></div>
            <div class="info-card"><div class="label">Buff/Steam</div><div class="value">${ratio}</div></div>
        </div>`;

    // 价格走势
    if (d.priceHistory.length > 1)
        html += `<div class="chart-section"><h4>📈 价格走势（采集记录）</h4><canvas id="priceChart"></canvas></div>`;
    if (d.buffPriceHistory.length > 1)
        html += `<div class="chart-section"><h4>📊 Buff历史价格</h4><canvas id="buffChart"></canvas></div>`;

    // 成交记录
    const txs = d.transactions;
    if (txs.length > 0) {
        html += `<div class="tx-list"><h4>📜 最近成交记录 (${txs.length}条)</h4>`;
        txs.slice(-20).reverse().forEach(tx => {
            const t = typeof tx.time==='number'?(tx.time>1e12?new Date(tx.time):new Date(tx.time*1000)).toLocaleString('zh-CN'):(tx.time||'-');
            html += `<div class="tx-item"><span class="tx-price">${fmtPrice(tx.price)}</span><span class="tx-time">${t}</span></div>`;
        });
        html += '</div>';
    }

    document.getElementById('modalContent').innerHTML = html;

    if (d.priceHistory.length > 1) drawChart('priceChart', d.priceHistory.map(h=>({t:h.t,p:h.p})));
    if (d.buffPriceHistory.length > 1) drawChart('buffChart', d.buffPriceHistory.map(h=>({t:h[0]*1000,p:h[1]})));
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }

// ===== Canvas 图表 =====
function drawChart(id, data) {
    const c = document.getElementById(id); if (!c) return;
    const ctx = c.getContext('2d');
    const W = c.width = c.offsetWidth * 2, H = c.height = 400;
    const pad = {top:20,right:60,bottom:30,left:10};
    const prices = data.map(d=>d.p), minP = Math.min(...prices)*.98, maxP = Math.max(...prices)*1.02;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
    for(let i=0;i<5;i++){
        const y=pad.top+(H-pad.top-pad.bottom)*i/4;
        ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();
        ctx.fillStyle='#667788';ctx.font='20px sans-serif';ctx.textAlign='right';
        ctx.fillText('¥'+num(maxP-(maxP-minP)*i/4),W-5,y+6);
    }
    ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.beginPath();
    data.forEach((d,i)=>{
        const x=pad.left+(W-pad.left-pad.right)*i/(data.length-1);
        const y=pad.top+(H-pad.top-pad.bottom)*(1-(d.p-minP)/(maxP-minP));
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
    const grad=ctx.createLinearGradient(0,pad.top,0,H-pad.bottom);
    grad.addColorStop(0,'rgba(79,195,247,.15)');grad.addColorStop(1,'rgba(79,195,247,0)');
    ctx.lineTo(W-pad.right,H-pad.bottom);ctx.lineTo(pad.left,H-pad.bottom);ctx.closePath();
    ctx.fillStyle=grad;ctx.fill();
}

// ===== 工具函数 =====
function fmtPrice(n) { return n!=null ? '¥'+Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2}) : '-'; }
function num(n) { return n!=null ? Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2}) : '-'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== 启动 =====
loadData();
setInterval(loadData, 5 * 60 * 1000);  // 每5分钟刷新
</script>
</body>
</html>
